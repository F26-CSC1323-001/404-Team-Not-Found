<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><style>body{font:16px Arial;background:#f3f6fb;display:grid;place-items:center;min-height:90vh}.panel{background:white;padding:32px;border-radius:16px;box-shadow:0 4px 24px #0001;max-width:360px;width:90%}input,button{box-sizing:border-box;width:100%;padding:12px;margin:9px 0;border:1px solid #ccd3df;border-radius:8px}button{background:#1267a8;color:white;border:0;cursor:pointer}.error{color:#a20d20}</style></head><body><main class="panel"><h1>Smart Attendance</h1><p>Administrator sign in</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></main></body></html>
